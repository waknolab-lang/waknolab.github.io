# Review template only. Copy the bindings into the existing production config
# after confirming the current Cloudflare route and compatibility settings.
name = "wakno-labs-auth"
main = "worker.js"
compatibility_date = "2026-11-04"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "wakno-admin"
database_id = "REPLACE_WITH_CREATED_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Public identifiers only. Never place API secrets in this file.
CF_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
CF_RUM_SITE_TAG = "REPLACE_WITH_WEB_ANALYTICS_SITE_TAG"
# Optional; if omitted the current recipient waknolab@gmail.com is retained.
# ORDER_NOTIFICATION_EMAIL = "waknolab@gmail.com"
